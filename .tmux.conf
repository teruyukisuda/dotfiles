# prefixキーをC-tに変更する
set -g prefix C-t

set -g history-limit 999999999

# C-bのキーバインドを解除する
unbind C-b

# C-f*2でtmux内のプログラムにC-fを送る
bind C-f send-prefix

#メッセージ表示時間指定
set-option -g display-time 10000
set-option -g display-panes-time 10000

# キーストロークのディレイを減らす
set -sg escape-time 1

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# 設定ファイルをリロードする
bind r source-file ~/.tmux.conf \; display "Configuration Reloaded!"

# new windowの際、pwdの継承
bind c new-window -c "#{pane_current_path}"

# \ でペインを縦に分割する
bind \\ split-window -c "#{pane_current_path}" -h

# - でペインを横に分割する
bind - split-window -c "#{pane_current_path}" -v

# Vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 256色端末を使用する
set -g default-terminal "screen-256color"


# statusラインと上部に配置
set -g status-position top
## statusラインの背景色
set -g status-bg colour234
## statusラインの位置
set -g status-justify centre

# paneのボーダーの色設定
# https://upload.wikimedia.org/wikipedia/commons/1/15/Xterm_256color_chart.svg
set -g pane-border-style fg="colour238"
set -g pane-active-border-style fg="colour119"

# 左パネルを設定する
set -g status-left-length 40
set -g status-left "#[fg=green] #S #[fg=yellow]#I #[fg=cyan]#P"

# センターパネルを設定する
setw -g window-status-style "none"
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-current-style "bold"
setw -g window-status-current-format '\
#[fg=colour239]#[bg=colour234]#[bg=colour239]#[fg=colour119]\
#I#[fg=colour249]:#[fg=colour255]#W#[fg=colour249]\
#F#[fg=colour239]#[bg=colour234]'

# 右パネルを設定する
set -g status-right-length 50
set -g status-right "#[fg=colour255,bg=colour27] %Y-%m-%d #[fg=colour255,bg=colour234] (%a) #[fg=colour226,bg=colour27] %H:%M "

## リフレッシュの間隔を設定する(デフォルト 15秒)
set -g status-interval 60

## ヴィジュアルノーティフィケーションを有効にする
setw -g monitor-activity on
set -g visual-activity on


# コピーモードでクリップボードへコピーする (vi キーバインド)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"


set-option -g default-shell "/opt/homebrew/bin/bash"
set -g default-command "/opt/homebrew/bin/bash"


# tpm(tmuxプラグイン管理)の設定
# プラグインリスト
set -g @tpm_plugins '              \
  tmux-plugins/tpm                 \
  tmux-plugins/tmux-resurrect      \
  tmux-plugins/tmux-continuum      \
'

# tmux-resurrect の設定
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'ssh python3 node npm "git log" htop top'

# tmux-continuum の設定（自動保存）
set -g @continuum-restore 'on'           # tmux起動時に自動復元
set -g @continuum-save-interval '15'     # 15分ごとに自動保存

# TPM実行（この行は最後に配置）
run-shell '~/.tmux/plugins/tpm/tpm'
